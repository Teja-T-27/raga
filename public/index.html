<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>raga · a chat over your songs</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2; --fg: #1a1a1a; --muted: #8a857c;
    --card: #ffffff; --border: #ece5d8; --panel: #f5f0e6;
    --accent: #7a5cff; --accent-soft: #ede8ff;
    --good: #4a8; --good-soft: #eaf6ec;
    --shadow: 0 1px 3px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
    --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --sans: "Inter", -apple-system, system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #14141a; --fg: #f0ede6; --muted: #8a857c;
    --card: #1c1c24; --border: #2a2a35; --panel: #23232e;
    --accent: #a493ff; --accent-soft: #2a2440;
    --good: #6ac; --good-soft: #1e2f28;
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--fg);
    max-width: 780px; margin: 0 auto; padding: 40px 24px 140px;
    line-height: 1.55; font-size: 15.5px;
    transition: background .2s, color .2s;
  }

  .theme-toggle {
    position: fixed; top: 20px; right: 20px; z-index: 50;
    background: var(--card); border: 1px solid var(--border);
    width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; box-shadow: var(--shadow);
    transition: transform .15s;
  }
  .theme-toggle:hover { transform: rotate(20deg); }

  .hero { margin-bottom: 32px; }
  h1 {
    font-family: var(--serif); font-weight: 500; font-size: 64px;
    letter-spacing: -2px; margin: 0 0 6px; line-height: 1;
  }
  h1 em { color: var(--accent); font-style: italic; }
  .tagline { color: var(--muted); font-size: 15px; margin-bottom: 20px; max-width: 560px; }
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .stat { text-align: center; }
  .stat .n { font-family: var(--serif); font-size: 30px; font-weight: 500; color: var(--accent); line-height: 1; }
  .stat .l { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-top: 6px; }

  .prompts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
  .prompts button {
    background: var(--card); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 999px; font-size: 13px;
    cursor: pointer; color: var(--fg); font-family: inherit;
    transition: all .15s;
  }
  .prompts button:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

  #chat { display: flex; flex-direction: column; gap: 32px; margin-bottom: 24px; }
  .turn { animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .q {
    font-family: var(--serif); font-size: 24px; font-weight: 500;
    color: var(--fg); border-left: 3px solid var(--accent);
    padding-left: 14px; margin-bottom: 14px;
  }
  .a { white-space: pre-wrap; color: var(--fg); font-size: 15.5px; }
  .status {
    font-size: 12.5px; color: var(--muted); font-style: italic;
    margin: 6px 0; display: flex; align-items: center; gap: 8px;
  }
  .status::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

  /* skeleton loader */
  .skel { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .skel .line { height: 12px; border-radius: 4px; background: linear-gradient(90deg, var(--panel) 25%, var(--border) 50%, var(--panel) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  .skel .line:nth-child(2) { width: 90%; }
  .skel .line:nth-child(3) { width: 70%; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; align-items: center; }
  .chip {
    background: var(--accent-soft); color: var(--accent);
    padding: 4px 10px; border-radius: 999px; font-size: 12px;
    cursor: pointer; border: 0; font-family: inherit;
    transition: transform .1s;
  }
  .chip:hover { transform: translateY(-1px); }
  .chip.label { background: var(--panel); color: var(--muted); cursor: default; }

  .timeline { margin: 12px 0; position: relative; padding-left: 20px; }
  .timeline::before {
    content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px;
    width: 2px; background: var(--border);
  }
  .step {
    position: relative; padding: 6px 0 6px 8px; font-size: 13px; color: var(--fg);
  }
  .step::before {
    content: ""; position: absolute; left: -18px; top: 12px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--card); border: 2px solid var(--accent);
  }
  .step.done::before { background: var(--accent); }
  .step .label { font-weight: 600; color: var(--fg); font-size: 13px; }
  .step summary { cursor: pointer; list-style: none; }
  .step summary::-webkit-details-marker { display: none; }
  .step details[open] summary .caret { transform: rotate(90deg); }
  .step .caret { display: inline-block; transition: transform .15s; margin-right: 4px; color: var(--muted); }
  .step .detail { margin-top: 6px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }

  .judge {
    background: var(--good-soft); border-radius: 8px; padding: 10px 14px;
    font-size: 13px; color: var(--good); margin-top: 12px;
    display: flex; gap: 16px; flex-wrap: wrap;
  }
  .judge b { color: var(--good); }

  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; padding: 4px 10px;
    border-radius: 6px; cursor: pointer; font-family: inherit;
    transition: all .15s;
  }
  .actions button:hover { color: var(--accent); border-color: var(--accent); }

  form {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg);
    border-top: 1px solid var(--border); padding: 16px 24px;
    display: flex; justify-content: center; z-index: 10;
    backdrop-filter: blur(8px);
  }
  .bar { max-width: 780px; width: 100%; display: flex; gap: 8px; align-items: center; }
  input[type=text] {
    flex: 1; padding: 12px 16px; border: 1px solid var(--border);
    border-radius: 999px; font-size: 15px; background: var(--card);
    font-family: inherit; outline: none; color: var(--fg);
  }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button.send {
    background: var(--fg); color: var(--bg); border: 0; padding: 12px 22px;
    border-radius: 999px; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 500;
  }
  button.send:disabled { opacity: .4; cursor: not-allowed; }
  label.mode {
    font-size: 12.5px; color: var(--muted); display: flex;
    align-items: center; gap: 6px; cursor: pointer; user-select: none;
    padding-left: 8px;
  }

  .panel-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.35);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100;
  }
  .panel-bg.open { opacity: 1; pointer-events: auto; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 92vw);
    background: var(--bg); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform .25s ease; z-index: 101;
    overflow-y: auto; padding: 40px 28px;
  }
  .panel.open { transform: translateX(0); }
  .panel .close {
    position: absolute; top: 16px; right: 16px; background: transparent;
    border: 0; font-size: 24px; cursor: pointer; color: var(--muted);
  }
  .panel h2 {
    font-family: var(--serif); font-weight: 500; font-size: 32px;
    margin: 0 0 4px; line-height: 1.15; color: var(--fg);
  }
  .panel .artist { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .panel .row { margin-bottom: 16px; font-size: 14px; }
  .panel .row .k {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); margin-bottom: 4px;
  }
  .panel .row .v { color: var(--fg); line-height: 1.5; }
  .panel .themes span {
    display: inline-block; background: var(--panel); padding: 3px 10px;
    border-radius: 999px; font-size: 12px; margin: 2px 4px 2px 0; color: var(--fg);
  }
  .panel .summary { font-family: var(--serif); font-size: 18px; font-style: italic; color: var(--fg); line-height: 1.4; }
  .panel .translation { background: var(--panel); padding: 12px 14px; border-radius: 8px; font-size: 14px; color: var(--fg); line-height: 1.5; }

  footer {
    margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 12px; text-align: center;
  }
  footer a { color: var(--muted); }

  @media (max-width: 600px) {
    h1 { font-size: 44px; letter-spacing: -1px; }
    body { padding: 24px 16px 140px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .theme-toggle { top: 12px; right: 12px; }
    .q { font-size: 20px; }
    label.mode { display: none; }
    form { padding: 12px 16px; }
  }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" title="toggle theme">◐</button>

<header class="hero">
  <h1><em>raga</em></h1>
  <div class="tagline">a chat over a personal playlist · themes, moods, translations, cross-song analysis.</div>
  <div class="stats">
    <div class="stat"><div class="n">88</div><div class="l">songs</div></div>
    <div class="stat"><div class="n">6</div><div class="l">languages</div></div>
    <div class="stat"><div class="n">3072</div><div class="l">embed dim</div></div>
    <div class="stat"><div class="n">4</div><div class="l">agent roles</div></div>
  </div>
</header>

<div class="prompts">
  <button data-p="which songs are about longing at night?">longing at night</button>
  <button data-p="compare how heartbreak is expressed across languages">heartbreak across languages</button>
  <button data-p="which songs would fit a slow rainy evening?">rainy evening</button>
  <button data-p="find high-energy party tracks">party tracks</button>
  <button data-p="which songs have the most vivid imagery?">vivid imagery</button>
</div>

<div id="chat"></div>

<form id="f">
  <div class="bar">
    <input id="q" type="text" placeholder="ask anything…" autocomplete="off" required>
    <label class="mode"><input type="checkbox" id="research"> research</label>
    <button class="send" id="b">ask</button>
  </div>
</form>

<footer>built with gemini · retrieval-augmented · multi-agent</footer>

<div class="panel-bg" id="panelBg"></div>
<aside class="panel" id="panel">
  <button class="close" id="panelClose">×</button>
  <div id="panelBody"></div>
</aside>

<script>
// theme
const themeToggle = document.getElementById('themeToggle');
const savedTheme = localStorage.getItem('raga-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
themeToggle.textContent = savedTheme === 'dark' ? '☀' : '◐';
themeToggle.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  if (next === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  themeToggle.textContent = next === 'dark' ? '☀' : '◐';
  localStorage.setItem('raga-theme', next);
};

const chat = document.getElementById('chat');
const f = document.getElementById('f'), q = document.getElementById('q'), b = document.getElementById('b');
const research = document.getElementById('research');
const panel = document.getElementById('panel'), panelBg = document.getElementById('panelBg'), panelBody = document.getElementById('panelBody');
document.getElementById('panelClose').onclick = closePanel;
panelBg.onclick = closePanel;
function closePanel() { panel.classList.remove('open'); panelBg.classList.remove('open'); }
async function openSongPanel(title) {
  panel.classList.add('open'); panelBg.classList.add('open');
  panelBody.innerHTML = '<div class="skel"><div class="line"></div><div class="line"></div><div class="line"></div></div>';
  const r = await fetch('/api/song?title=' + encodeURIComponent(title));
  const s = await r.json();
  if (s.error) { panelBody.innerHTML = `<div style="color:var(--muted)">${s.error}</div>`; return; }
  panelBody.innerHTML = `
    <h2>${s.title}</h2>
    <div class="artist">${s.artist} · ${s.language}</div>
    <div class="row"><div class="summary">"${s.summary}"</div></div>
    <div class="row"><div class="k">mood</div><div class="v">${s.mood}</div></div>
    <div class="row"><div class="k">themes</div><div class="v themes">${(s.themes||[]).map(t=>`<span>${t}</span>`).join('')}</div></div>
    ${s.translation ? `<div class="row"><div class="k">translation</div><div class="translation">${s.translation}</div></div>` : ''}
  `;
}

const history = [];
document.querySelectorAll('.prompts button').forEach(btn => {
  btn.onclick = () => { q.value = btn.dataset.p; q.focus(); };
});

async function ask(text) {
  const mode = research.checked ? 'research' : 'simple';
  const turn = document.createElement('div');
  turn.className = 'turn';
  turn.innerHTML = `<div class="q">${text}</div><div class="body"></div>`;
  chat.appendChild(turn);
  const body = turn.querySelector('.body');
  const statusEl = document.createElement('div');
  statusEl.className = 'status';
  statusEl.textContent = 'thinking…';
  body.appendChild(statusEl);
  const skel = document.createElement('div');
  skel.className = 'skel';
  skel.innerHTML = '<div class="line"></div><div class="line"></div><div class="line"></div>';
  body.appendChild(skel);

  const timeline = document.createElement('div');
  timeline.className = 'timeline';
  let usingTimeline = false;

  history.push({role:'user', content:text});
  b.disabled = true;

  const answerEl = document.createElement('div');
  answerEl.className = 'a';
  let answerStarted = false;

  const r = await fetch('/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({history, mode})
  });
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = '', fullAnswer = '';

  function addStep(label, detailHTML) {
    if (!usingTimeline) { body.insertBefore(timeline, statusEl); usingTimeline = true; }
    timeline.querySelectorAll('.step').forEach(s => s.classList.add('done'));
    const step = document.createElement('div');
    step.className = 'step';
    if (detailHTML) {
      step.innerHTML = `<details><summary><span class="caret">▸</span><span class="label">${label}</span></summary><div class="detail">${detailHTML}</div></details>`;
    } else {
      step.innerHTML = `<span class="label">${label}</span>`;
    }
    timeline.appendChild(step);
  }
  function attachChipHandlers(root) {
    root.querySelectorAll('.chip[data-t]').forEach(c => c.onclick = () => openSongPanel(c.dataset.t));
  }

  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const part of parts) {
      const lines = part.split('\n');
      let ev = 'message', data = '';
      for (const line of lines) {
        if (line.startsWith('event: ')) ev = line.slice(7).trim();
        else if (line.startsWith('data: ')) data += line.slice(6);
      }
      if (!data) continue;
      let payload;
      try { payload = JSON.parse(data); } catch { continue; }

      if (ev === 'status') {
        statusEl.textContent = payload.text;
      } else if (ev === 'retrieved') {
        const chips = document.createElement('div');
        chips.className = 'chips';
        chips.innerHTML = `<span class="chip label">retrieved</span>` + payload.songs.map(s => `<button class="chip" data-t="${s.title.replace(/"/g,'&quot;')}">${s.title}</button>`).join('');
        attachChipHandlers(chips);
        body.insertBefore(chips, statusEl);
      } else if (ev === 'plan') {
        addStep('planned sub-questions', '<ol style="margin:4px 0 0;padding-left:18px">' + payload.subqs.map(s=>`<li>${s}</li>`).join('') + '</ol>');
      } else if (ev === 'sub') {
        const chipHTML = payload.retrieved.map(t => `<button class="chip" data-t="${t.replace(/"/g,'&quot;')}">${t}</button>`).join(' ');
        addStep(`sub-agent ${payload.i}`, `<div class="chips">${chipHTML}</div>`);
        setTimeout(() => attachChipHandlers(timeline), 0);
      } else if (ev === 'chunk') {
        if (!answerStarted) {
          if (statusEl.parentNode) statusEl.remove();
          if (skel.parentNode) skel.remove();
          if (usingTimeline) timeline.querySelectorAll('.step').forEach(s => s.classList.add('done'));
          body.appendChild(answerEl);
          answerStarted = true;
        }
        fullAnswer += payload.text;
        answerEl.textContent = fullAnswer;
        window.scrollTo(0, document.body.scrollHeight);
      } else if (ev === 'judge') {
        const j = document.createElement('div');
        j.className = 'judge';
        if (payload.grounding !== undefined) {
          j.innerHTML = `<span><b>grounding</b> ${payload.grounding}/10</span><span><b>coherence</b> ${payload.coherence}/10</span><span><b>directness</b> ${payload.directness}/10</span>${payload.notes?`<span style="width:100%;color:var(--good)">${payload.notes}</span>`:''}`;
        } else {
          j.textContent = payload.notes || JSON.stringify(payload);
        }
        body.appendChild(j);
      } else if (ev === 'error') {
        statusEl.textContent = 'error: ' + payload.message;
      } else if (ev === 'done') {
        if (statusEl.parentNode) statusEl.remove();
        if (skel.parentNode) skel.remove();
      }
    }
  }

  // action buttons: copy + share
  const actions = document.createElement('div');
  actions.className = 'actions';
  actions.innerHTML = `<button data-a="copy">copy answer</button><button data-a="share">share query</button>`;
  actions.querySelector('[data-a=copy]').onclick = () => {
    navigator.clipboard.writeText(fullAnswer);
    actions.querySelector('[data-a=copy]').textContent = 'copied ✓';
    setTimeout(() => actions.querySelector('[data-a=copy]').textContent = 'copy answer', 1500);
  };
  actions.querySelector('[data-a=share]').onclick = () => {
    const url = location.origin + '?q=' + encodeURIComponent(text) + (mode==='research'?'&research=1':'');
    navigator.clipboard.writeText(url);
    actions.querySelector('[data-a=share]').textContent = 'link copied ✓';
    setTimeout(() => actions.querySelector('[data-a=share]').textContent = 'share query', 1500);
  };
  body.appendChild(actions);

  history.push({role:'model', content: fullAnswer});
  b.disabled = false;
  q.focus();
  window.scrollTo(0, document.body.scrollHeight);
}

f.onsubmit = e => { e.preventDefault(); const t = q.value.trim(); if (!t) return; q.value=''; ask(t); };

// deep-link: ?q=...&research=1
const params = new URLSearchParams(location.search);
if (params.get('q')) {
  if (params.get('research')) research.checked = true;
  setTimeout(() => ask(params.get('q')), 200);
}
</script>
</body>
</html>
